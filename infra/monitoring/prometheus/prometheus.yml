global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vozjusta-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
        labels:
          app: vozjusta-api

  - job_name: vozjusta-synthetic
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9201
        labels:
          app: vozjusta-synthetic
          mode: synthetic

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
