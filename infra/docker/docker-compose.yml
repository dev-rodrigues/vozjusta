services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vozjusta-postgres
    environment:
      POSTGRES_USER: vozjusta
      POSTGRES_PASSWORD: vozjusta
      POSTGRES_DB: vozjusta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vozjusta -d vozjusta"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.5.11
    container_name: vozjusta-ollama
    ports:
      - "11434:11434"
    volumes:
      - ${VOZJUSTA_OLLAMA_DATA_DIR:-/Volumes/bucket/dev-rodrigues/vozjusta/.docker-data/ollama}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:0.5.11
    container_name: vozjusta-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./init-ollama.sh:/init-ollama.sh:ro
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["sh", "/init-ollama.sh"]
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: vozjusta-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${VOZJUSTA_PROMETHEUS_DATA_DIR:-/Volumes/bucket/dev-rodrigues/vozjusta/.docker-data/prometheus}:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${VOZJUSTA_PROMETHEUS_RETENTION_TIME:-240h}"
      - "--storage.tsdb.wal-compression"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: vozjusta-grafana
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${VOZJUSTA_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${VOZJUSTA_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${VOZJUSTA_GRAFANA_DATA_DIR:-/Volumes/bucket/dev-rodrigues/vozjusta/.docker-data/grafana}:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  postgres_data:
