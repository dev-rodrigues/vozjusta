[project]
name = "vozjusta-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.3",
  "typer>=0.15.1",
]

[project.scripts]
vozjusta-eval = "vozjusta_eval.cli:main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vozjusta_eval"]
