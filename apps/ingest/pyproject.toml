[project]
name = "vozjusta-ingest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.15.1",
  "pydantic-settings>=2.7.1",
  "legal-kb",
]

[project.scripts]
vozjusta-ingest = "vozjusta_ingest.cli:main"

[tool.uv.sources]
legal-kb = { workspace = true }

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vozjusta_ingest"]
