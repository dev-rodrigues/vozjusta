[project]
name = "vozjusta-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.8",
  "uvicorn>=0.34.0",
  "sqlalchemy>=2.0.38",
  "psycopg[binary]>=3.2.5",
  "pgvector>=0.3.6",
  "alembic>=1.14.1",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",
  "requests>=2.32.3",
  "prometheus-client>=0.21.1",
  "rag-core",
  "legal-kb",
]

[project.scripts]
vozjusta-api = "vozjusta_api.main:run"

[tool.uv.sources]
rag-core = { workspace = true }
legal-kb = { workspace = true }

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vozjusta_api"]
