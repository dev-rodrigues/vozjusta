[project]
name = "legal-kb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0.38",
  "psycopg[binary]>=3.2.5",
  "pgvector>=0.3.6",
  "requests>=2.32.3",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",
  "rag-core",
]

[tool.uv.sources]
rag-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_kb"]
