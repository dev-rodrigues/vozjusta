[project]
name = "vozjusta-monorepo"
version = "0.1.0"
description = "Monorepo VozJusta V1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/ingest",
  "apps/eval",
  "packages/rag_core",
  "packages/legal_kb",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "pytest-cov>=5.0.0",
  "httpx>=0.28.1",
  "anyio>=4.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "apps/api/src",
  "apps/ingest/src",
  "apps/eval/src",
  "packages/rag_core/src",
  "packages/legal_kb/src",
]
addopts = "-q"
markers = [
  "integration: testes que dependem de infraestrutura externa (postgres/pgvector)",
]

[tool.coverage.run]
branch = true
source = [
  "apps/api/src/vozjusta_api",
  "apps/ingest/src/vozjusta_ingest",
  "packages/rag_core/src/rag_core",
  "packages/legal_kb/src/legal_kb",
]
